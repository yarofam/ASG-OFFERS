<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalogue share card — build tool</title>
<!-- Source for the catalogue's share.jpg. Build tool, not a published page: it
     lives in tools/ so the web root never serves it. Capture #card at exactly
     1200x630 and save it as share.jpg at the repository root.

     Both messengers are satisfied by the same file: exactly 1200x630 (1.91:1),
     JPEG, well under 300 kB, with og:image:width / og:image:height declared in
     the page head — without those WhatsApp falls back to a small square
     thumbnail. Telegram is looser but reads the same tags.

     The mark is the real vector lockup, with its descriptor, on the house
     ground. Nothing here dates: no vehicle, no count, no date. The catalogue
     URL never changes, and messengers cache a preview per URL forever. -->
<style>
@font-face{font-family:Onest;src:url("../assets/Onest.ttf") format("truetype");font-weight:100 900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#15181a}
body{display:flex;flex-direction:column;align-items:flex-start;gap:24px;padding:24px;font-family:Onest,system-ui,sans-serif}

.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#0a0c0d;flex:none;
      display:grid;place-items:center}

/* One diffused source from the upper right, and a floor that falls away —
   the same low-key lighting the offer heroes use. */
.card::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 95% at 76% 6%, rgba(241,90,36,0.10), transparent 58%),
             radial-gradient(100% 80% at 50% 46%, rgba(70,78,84,0.34), transparent 66%),
             radial-gradient(120% 90% at 50% 118%, rgba(0,0,0,0.65), transparent 62%)}

/* The lockup sits at 47% of the frame width, centred — comfortably inside the
   safe area, so a messenger's crop never touches it. */
.lockup{position:relative;width:564px;height:auto;display:block}

/* A hairline that stops short of the edges, to seat the mark on the ground
   rather than float it. */
.card::after{content:"";position:absolute;left:18%;right:18%;top:76%;height:1px;
  background:linear-gradient(90deg,transparent 0,rgba(242,240,235,0.16) 22%,rgba(242,240,235,0.16) 78%,transparent 100%)}

.hint{max-width:1200px;color:#7d8285;font-size:12px;line-height:1.7;letter-spacing:.06em}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="lockup" src="../assets/brand/asg-lockup-dark.svg" alt="">
</div>
<p class="hint">Build tool — capture #card at exactly 1200×630, save as share.jpg at the repository root, JPEG under 300 kB. No vehicle, no count, no date: the catalogue URL never changes and messengers cache a preview per URL for weeks.</p>
</body>
</html>
