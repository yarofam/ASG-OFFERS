<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASG catalogue link preview</title>
<!-- Source for the catalogue's share.jpg (1200x630). Same formula as an offer
     card: the photo full-bleed, the hero veil over it, the ASG mark without its
     subtitle, the coachline, and the title bottom-left. Change PHOTO below to
     use another car, re-render at 1200x630 and save over share.jpg. -->
<style>
  @font-face { font-family:"Onest"; src:url("../assets/Onest.ttf") format("truetype"); font-weight:100 900; }
  * { box-sizing:border-box; margin:0; }
  html { width:1200px; height:630px; }
  body { position:relative; width:1200px; height:630px; overflow:hidden;
         color:#fff; background:#0a0c0d; font-family:"Onest", sans-serif; }
  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
           object-position:50% 52%; filter:saturate(0.92) contrast(1.045) brightness(0.965); }
  .veil { position:absolute; inset:0;
          background:linear-gradient(90deg, rgba(10,12,13,0.96) 0%, rgba(10,12,13,0.82) 34%, rgba(10,12,13,0.25) 64%, rgba(10,12,13,0.34) 100%),
                     linear-gradient(0deg, rgba(10,12,13,0.68), transparent 46%); }
  .coachline { position:absolute; left:0; right:0; top:46.5%; height:2px;
               background:linear-gradient(90deg, #f15a24 0, #f15a24 74%, rgba(241,90,36,0) 100%); }
  .mark { position:absolute; left:72px; top:48px; width:186px; height:39px; }
  h1 { position:absolute; left:72px; bottom:74px; width:760px;
       font-size:76px; line-height:0.98; font-weight:600; letter-spacing:-0.035em; }
</style>
</head>
<body>
  <img class="photo" src="../o/txn45g/assets/media/01.webp" alt="">
  <span class="veil"></span>
  <span class="coachline"></span>
  <img class="mark" src="../assets/brand/asg-lockup-mark.svg" alt="">
  <h1>Current<br>vehicles</h1>
</body>
</html>
